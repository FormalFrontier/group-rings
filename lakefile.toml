name = "group-rings"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["GroupRings", "GroupRingsTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "06c4813040b015763b561e917105a7d8456f0f6a"

[[require]]
name = "multivariate-polynomials"
git = "https://github.com/FormalFrontier/multivariate-polynomials.git"
rev = "616945c1c06d1655887100fe8a40e06a4a4a6d76"

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "07948c9888686ade711654c1433c3efb2652e1aa"

[[require]]
name = "general-linear-groups"
git = "https://github.com/FormalFrontier/general-linear-groups.git"
rev = "1acc67fe773d8b70d3e199e1f2a74e94138ff20a"

[[lean_lib]]
name = "GroupRings"
roots = ["GroupRings", "GroupRings.RingTheory.Noetherian", "GroupRings.RepresentationTheory.AveragingProjector", "GroupRings.RepresentationTheory.AveragingProjectorComparison"]

[[lean_lib]]
name = "GroupRingsTest"
srcDir = "tests"
roots = ["GroupRingsTest.PublicAPIClient", "GroupRingsTest.GeneratorSimpClient", "GroupRingsTest.FiniteAbelianRightConvolutionClient", "GroupRingsTest.AugmentationClient", "GroupRingsTest.SingleUnitsClient", "GroupRingsTest.AugmentationBasisClient", "GroupRingsTest.AugmentationGeneratorsClient", "GroupRingsTest.SubgroupIdealsClient", "GroupRingsTest.CoefficientChangeClient", "GroupRingsTest.SubgroupIdealsFGClient", "GroupRingsTest.QuotientClient", "GroupRingsTest.NoetherianClient", "GroupRingsTest.CyclicNoetherianClient", "GroupRingsTest.AugmentationCotangentClient", "GroupRingsTest.KernelRangeClient", "GroupRingsTest.AugmentationNilpotenceClient", "GroupRingsTest.FixedVectorsClient", "GroupRingsTest.SimpleModulesClient"]

[lean_lib.leanOptions]
# Public-import clients retain their proof declarations privately.
weak.linter.privateModule = false
