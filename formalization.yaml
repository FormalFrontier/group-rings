version: "v0.4"

project:
  name: "Group rings and free abelian Laurent coordinates"
  description: >-
    Reusable Lean algebra equivalences from group algebras equipped with explicit
    free-abelian coordinates to multivariable Laurent polynomial algebras, with
    canonical FreeAbelianGroup specialization and forward/inverse basis and
    free-generator laws. Laurent monomials are finitely supported integer
    exponent vectors; no finite-variable or decidable-equality premise is added.
  authors:
    - "Formal Frontier Agents"
    - "Prism (AI agent; source diagnostic, mathematical implementation, setup, integration, native interfaces, clients, metadata and documentation adaptation)"
    - "Anchor (AI agent; predecessor Markdown documentation adapter, tests and recipe)"
  responsible_maintainers:
    - "Prism (on behalf of the source-maintainer team)"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: >-
      Complete-book build dated 2013-08-29, Example I.2.1.2, displayed page 9
      (physical PDF page 17), the free-abelian integral group-ring identification.
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Formalizes the bounded algebra identification through explicit additive
      coordinates and generalizes integer coefficients to commutative semirings.
      It does not choose coordinates from an unbundled freeness assertion and
      does not prove the following projective-freeness consequence. No PID,
      Laurent-PID, Quillen-Suslin, Bass-Quillen, stable-freeness, nonabelian
      group-ring or K-theory result follows. Bibliographic authorship is distinct
      from Lean expression provenance, and source-specific correspondence and
      coverage decisions remain in the source repository.
      The canonical private-project asset is library
      s-a1e29c47d014454b97d2ecbaef6b4282/v001, 4,958,181 bytes, SHA-256
      a04f53c9393b20672fab2a6818279b2f9996dbc7cf74735789ed13804b058845.
      The author-hosted source was supplied for the private project library;
      no explicit license or broader redistribution grant was established.
      Pagination differs from the AMS print edition. The selection-time errata
      URL returned HTTP 404; no errata original is included or claimed. No book
      PDF, scan or quoted passage is shipped in this repository.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/e37d88a26f3791ed5a93daa1f949af1021b8d103"
    relationship: "builds-on"
    note: >-
      The only direct library dependency. Uses FreeAbelianGroup.equivFinsupp,
      AddMonoidAlgebra.toMultiplicativeAlgEquiv and AddMonoidAlgebra.domCongr,
      with their native injectivity and single-term laws. Imports
      Mathlib.Algebra.FreeAbelianGroup.Finsupp and Mathlib.Algebra.MonoidAlgebra.Basic;
      it does not introduce another group-algebra quotient or algebra class.
      Dependency implementation is not vendored; upstream authorship and notices
      remain upstream. The Lake manifest is generated dependency resolution
      metadata, not original dependency implementation. No inter-deliverable
      development dependency is declared.
  - id: "source-weibel-k-book@99b7f9213a895fef2aebe6d7210fb7fc24ccd14d:WeibelKBook/Experiments/ExampleI212FreeAbelianGroupRingDiagnostic.lean"
    relationship: "adapts"
    note: >-
      Prism's earlier integer-coefficient source diagnostic, 3,670 bytes, SHA-256
      a10a581bad005acc226c1f7c40464508a4d45fcc49d1e31e507a53c4972fa288,
      is an actual expression predecessor, not merely a mathematical citation.
      Production commit e82f26a6a29bae597fa3b0d6011ef7c43dfc3ede adapts
      its two-equivalence composition, forward-single local have/injectivity/simp
      proof, canonical specialization and generator rw/simp structure. It adds
      inverse-single laws, coefficient generality and independent universes;
      the production group premise is explicitly AddCommGroup. The source-local
      FreeAbelianGroupRing abbreviation is not a production export. This is
      identified internal reuse, not a wholly new proof-expression claim.

