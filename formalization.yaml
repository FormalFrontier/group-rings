version: "v0.4"

project:
  name: "Monoid-algebra units, augmentation, Laurent coordinates and finite-abelian Fourier convolution"
  description: >-
    Reusable Lean algebra equivalences from group algebras equipped with explicit
    free-abelian coordinates to multivariable Laurent polynomial algebras, with
    canonical FreeAbelianGroup specialization and forward/inverse basis and
    free-generator laws. Laurent monomials are finitely supported integer
    exponent vectors; no finite-variable or decidable-equality premise is added.
    Separately, field-valued finite-abelian characters give evaluation bases
    when enough roots exist; right convolution has positive-character
    eigenvalues, diagonalization and a Nat.card rank formula. Monoid-algebra
    augmentation sums coefficients over any semiring and monoid; over any ring,
    its kernel is the left ideal generated by the differences single m 1 - 1.
    A monoid generating set, or a subgroup generating set for groups, suffices
    for these left-ideal generators. Generic difference-membership lemmas
    propagate through monoid and subgroup closure in any ring's left ideals.
    As a left coefficient-ring module it also has a basis indexed by nonidentity
    monoid elements, with those vectors and the original coefficients as coordinates.
    A generic pointed Finsupp sum-kernel equivalence underlies this basis.
    Single-term units over nontrivial semirings are exactly the terms whose
    coefficient and monoid index are both units. Coefficient-unit reflection
    holds over every semiring, including the trivial one.
    For an arbitrary subgroup of a group, its left ideal of basis differences
    consists of exactly the elements with zero coefficient sums on left cosets.
    Over a nontrivial ring these ideals reflect subgroup membership and inclusion,
    and two-sidedness is equivalent to subgroup normality. No group or coefficient
    commutativity or finiteness is needed. The coset map itself is semiring-general.
    Subgroup finite generation implies finite generation of its left group-ring
    ideal over any ring; over a nontrivial ring the converse holds. For the whole
    group this characterizes finite generation of the augmentation kernel.
    Left-Noetherian group algebras over nontrivial rings have every subgroup
    finitely generated. Surjective augmentation combines with the generic
    surjective-homomorphism Noetherianity theorem for coefficient descent over
    arbitrary semirings and monoids. No converse is asserted.
    No group-algebra/convolution bridge is asserted.
  authors: [Formal Frontier Agents]
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: >-
      Complete-book build dated 2013-08-29, Example I.2.1.2, displayed page 9
      (physical PDF page 17), the free-abelian integral group-ring identification.
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Formalizes the bounded algebra identification through explicit additive
      coordinates and generalizes integer coefficients to commutative semirings.
      It does not choose coordinates from an unbundled freeness assertion and
      does not prove the following projective-freeness consequence. No PID,
      Laurent-PID, Quillen-Suslin, Bass-Quillen, stable-freeness, nonabelian
      group-ring or K-theory result follows. Bibliographic authorship is distinct
      from Lean expression provenance, and source-specific correspondence and
      coverage decisions remain in the source repository. Pagination here
      follows the cited complete-book build, not the AMS print edition.
      No redistribution license for the book is asserted; no book PDF, scan,
      proof excerpt or dependency asset is distributed with this library.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5"
    relationship: "builds-on"
    note: >-
      The only direct library dependency. Uses FreeAbelianGroup.equivFinsupp,
      AddMonoidAlgebra.toMultiplicativeAlgEquiv and AddMonoidAlgebra.domCongr,
      with their native injectivity and single-term laws. The Laurent leaf
      imports Mathlib.Algebra.FreeAbelianGroup.Finsupp and
      Mathlib.Algebra.MonoidAlgebra.Basic; the separate Fourier leaf imports
      Mathlib.GroupTheory.FiniteAbelian.Duality,
      Mathlib.LinearAlgebra.FiniteDimensional.Lemmas,
      Mathlib.LinearAlgebra.LinearIndependent.Basic,
      Mathlib.LinearAlgebra.Matrix.Rank and
      Mathlib.Analysis.Fourier.FiniteAbelian.PontryaginDuality. It reuses
      native character independence, finite duality, matrix rank and
      AddChar.complexBasis. Augmentation uses mapDomainRingHom and
      uniqueRingEquiv, with sum_coeff_single, Finsupp sum laws and left-ideal
      closure for its kernel theorem. It does not introduce another
      group-algebra quotient or algebra class. Single-term units use the
      augmentation for coefficient reflection, coefficient-vanishing laws for
      left and right index inverses, and mathlib's commuting-factor, product-unit
      and local-homomorphism APIs. No new algebra or map model is introduced.
      Dependency implementation is not vendored; upstream authorship and notices
      remain upstream. The Lake manifest is generated dependency resolution
      metadata, not original dependency implementation. No inter-deliverable
      development dependency is declared. The coefficient-module kernel basis reuses
      lsum with auxiliary scalar ℕ, lsubtypeDomain, lmapDomain, coeffLinearEquiv,
      MonoidAlgebra.basis, Basis.sumCoords, submodule equivalences and Basis.ofRepr.
      Its generic pointed equivalence restricts away from a point and inverts by
      extension minus a single coefficient-sum correction. Generating-set
      augmentation formulas reuse the kernel theorem and generic
      difference-membership lemmas, implemented via the left module quotient,
      stabilizer submonoid and subgroup, pullback actions and closure order laws.
      Subgroup ideals use stock coefficient-linear reindexing, left coset equality,
      chosen quotient representatives and ideal spans, without a new generic
      reindexing framework or quotient-ring model. Subgroup-ideal finite generation
      reuses mathlib's finite subset of the original spanning set, finite-span FG
      and subgroup FG interfaces, together with the closure and inclusion-reflection
      theorems for subgroup differences. The left-Noetherian necessary conditions
      reuse every-ideal finite generation and the generic arbitrary-semiring
      transport isNoetherianRing_of_surjective, without a specialized duplicate.
  - id: "CREDITS.md"
    relationship: "adapts"
    note: >-
      Prism's integral source diagnostic is an actual Lean expression
      predecessor of the Laurent equivalence composition, forward basis proof
      and canonical/generator pattern, extended here by inverse laws,
      commutative-semiring coefficients and independent universes. The integer
      generator client also follows a source adapter's expression; restricted-simp
      and priority tests are separate work. The source-local abbreviation is not
      exported. Beacon's character experiment is the expression predecessor of
      the generic-field Fourier API; Formal Frontier AI contributors supplied
      generic-field character and convolution mathematics, reusable library API
      and Fourier applications.
      CREDITS.md also identifies Anchor's documentation adapter and other
      contributor and upstream credit. None of these results asserts source
      coverage or a group-algebra/convolution bridge.

status:
  scope: >-
    Reusable Laurent-coordinate algebra equivalences and canonical free-abelian
    specialization coexist with generic-field additive-character results and
    algebraic finite-abelian right convolution. The Laurent abbreviation has
    semiring coefficients; equivalences require commutative semirings and
    supplied additive coordinates, not chosen coordinates. Character
    independence needs neither finiteness nor enough roots; character finiteness
    needs a finite group but no roots. The evaluation basis, convolution
    diagonalization and Nat.card rank formula require enough roots of unity.
    The monoid-algebra augmentation map needs only a semiring and a monoid in
    independent universes. Its kernel/left-span theorem needs a ring, but no
    commutativity, inverses, finiteness or nontriviality. The span can be
    restricted to a monoid generating set, or to an ordinary subgroup generating
    set for groups. The generic difference-membership interface works for any
    monoid homomorphism into any ring and any left ideal, without a group
    structure on the target. Its kernel also has a
    left coefficient-ring module basis indexed by nonidentity monoid elements;
    vectors are single m 1 - 1 and coordinates are coefficients at m.
    The generic engine needs Semiring S, AddCommGroup V and Module S V, with
    scalar, coefficient and pointed index types in independent universes.
    The augmentation/sumCoords and restricted-kernel bridges need only Semiring R.
    The single-term unit
    criterion assumes only a nontrivial semiring and an arbitrary monoid in
    independent universes; the coefficient-reflection direction does not require
    nontriviality. The basis embedding reflects units under the same
    nontriviality hypothesis, expressed as IsLocalHom.
    For any subgroup of a group, the subgroup-difference left ideal consists of
    exactly the elements with zero coset coefficient sums, without normality or
    nontriviality. Membership and order reflection, and the converse from
    two-sidedness to normality, require nontrivial coefficients; normality implies
    two-sidedness over every ring. The target uses the left coset type as a module
    index, not a quotient group or ring for nonnormal subgroups. A finitely
    generated subgroup gives a finitely generated left ideal over any ring. The
    converse requires Nontrivial R, but no normality. For the top subgroup this
    yields the same all-ring forward and nontrivial-ring equivalence between
    augmentation-kernel FG and Group.FG. These ideals are generated over R[G],
    not as coefficient-ring modules. Left-Noetherianity of a group algebra over
    a nontrivial ring forces finite generation of every subgroup, without
    normality or commutativity. For any semiring and monoid, surjective
    augmentation transports left-Noetherianity to the coefficient semiring via
    the generic stock theorem. No sufficient-condition converse is asserted.
    The selected public interfaces below are not a census of private/generated declarations or
    client tests.
    The generated API page is a historical four-module/eight-Laurent snapshot
    with its original native-record binding, not a current whole-library
    analysis. The handwritten Fourier guide describes the current Fourier API.
