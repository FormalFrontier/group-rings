    - declaration: "MonoidAlgebra.subgroup_fg_of_isNoetherianRing"
      file: "GroupRings/MonoidAlgebra/Noetherian.lean"
      note: "Every subgroup of a group with left-Noetherian group algebra over a nontrivial possibly noncommutative ring is finitely generated; scalar ring is R[G], not R."
    - declaration: "MonoidAlgebra.augmentation_surjective"
      file: "GroupRings/MonoidAlgebra/Augmentation.lean"
      note: "Surjectivity over any semiring and monoid, with independent universes, allowing generic stock Noetherianity transport to the coefficient semiring."
    - declaration: "MonoidAlgebra.ker_mapDomainRingHom_mk'"
      file: "GroupRings/MonoidAlgebra/Quotient.lean"
      note: "For arbitrary ring coefficients, the kernel of the normal-quotient index map is the independently specified left span of the subgroup differences."
    - declaration: "MonoidAlgebra.quotientSpanSubgroupEquiv"
      file: "GroupRings/MonoidAlgebra/Quotient.lean"
      note: "The first-isomorphism ring equivalence has all-element and full single g r characteristic formulas and is uniquely characterized by its values on quotient classes."
    - declaration: "MonoidAlgebra.existsUnique_comp_mapDomainRingHom_mk'_iff"
      file: "GroupRings/MonoidAlgebra/Quotient.lean"
      note: "An arbitrary unital ring homomorphism into any semiring factors uniquely through the quotient index map exactly when every subgroup basis unit maps to one; the three universes are independent."
    - declaration: "MonoidAlgebra.cosetSum"
      file: "GroupRings/MonoidAlgebra/SubgroupIdeals.lean"
