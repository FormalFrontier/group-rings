fidelity:
  divergences: >-
    The source's integral group-ring observation is expressed via supplied
    additive coordinates and generalized to commutative semiring coefficients.
    The Laurent abbreviation needs only a semiring, but the algebra equivalences
    do not claim noncommutative coefficient generality. Finite support refers to
    each exponent vector, not a finite index set. Empty and infinite indices and
    the zero commutative semiring are allowed by the declared hypotheses; there
    is no added finiteness, decidability, nontriviality, domain, ring, field or
    projective-module premise. This is a multivariable exponent-vector model,
    not a theorem about native one-variable LaurentPolynomial, automatic basis
    selection, augmentation ideals, ideal generation, projective freeness or
    nonabelian groups. No full source example or K-theory coverage is claimed.
    The separate Fourier construction assumes a field and an additive abelian
    group; character independence needs no finiteness, its finite witness needs
    no enough-roots condition, and a complete evaluation basis and rank formula
    need enough roots of unity. Right-convolution eigenvalues use positive
    characters. There is no formal group-algebra bridge or additional
    source-coverage claim for the Fourier addition.

